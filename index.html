<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Lightwork Lounge Links</title>
    <link rel="icon" type="image/svg+xml" href="/images/lightwork-logo-dark.svg">

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Book a Lightwork Lounge session, follow Carlie Casten, and connect for Reiki, mediumship, crystals, and space clearing.">

    <!-- Keywords -->
    <meta name="keywords" content="Lightwork Lounge, Carlie Casten, Reiki, mediumship, crystal recommendations, space clearing">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://links.lightwork-lounge.com">

    <!-- Author Information -->
    <meta name="author" content="Carlie Casten">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--soft" src="images/lightwork-logo-dark.svg" alt="Lightwork Lounge logo">

            <!-- Replace with your name or brand -->
            <h1>
              <div>lightwork lounge</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Reiki, mediumship, crystal recommendations, and space clearing with Carlie Casten.</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <a class="button button-default" href="https://lightwork-lounge.com/?ref=links"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="">Visit the Website</a>

              <a class="button button-default" href="https://book.lightwork-lounge.com/?ref=links"><img class="icon" aria-hidden="true" src="images/icons/generic-calendar.svg" alt="">Book a Session</a>

              <a class="button button-instagram" href="https://www.instagram.com/lightwork_lounge/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="">Instagram</a>

              <a class="button button-faceb" href="https://www.facebook.com/lightworklounge" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="">Facebook</a>

              <a class="button button-default" href="mailto:hello@lightwork-lounge.com" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="">Email Lightwork Lounge</a>

              <a class="button button-default" href="tel:+14075047899" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-phone.svg" alt="">Call 407-504-7899</a>

              <a class="button button-default" href="sms:+14075047899" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-sms.svg" alt="">Text 407-504-7899</a>


      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="privacy.html">Privacy Policy</a> | Built with <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
